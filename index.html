<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tracker · Marcel · v3.1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1a1a;
    --surface: #242424;
    --surface2: #2e2e2e;
    --surface3: #383838;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0ee;
    --muted: #888885;
    --amber: #EF9F27;
    --amber-light: #FAC775;
    --amber-dark: #BA7517;
    --green: #639922;
    --green-light: #97C459;
    --red: #E24B4A;
    --red-light: #F09595;
    --blue: #378ADD;
    --teal: #1D9E75;
    --purple: #A07ACC;
    --r: 10px;
    --safe-bottom: env(safe-area-inset-bottom, 0);
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; padding-bottom: var(--safe-bottom); }

  /* Header */
  .header { background: var(--surface); border-bottom: 0.5px solid var(--border2); padding: 14px 16px 12px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .logo { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; color: var(--amber); text-transform: uppercase; }
  .logo-version { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .date-badge { font-size: 12px; color: var(--muted); background: var(--surface2); padding: 4px 10px; border-radius: 20px; border: 0.5px solid var(--border); }

  /* Tabs */
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--border); background: transparent; color: var(--muted); transition: all 0.15s; white-space: nowrap; }
  .tab.active { background: var(--amber); color: #1a1a1a; border-color: var(--amber); }
  .tab:hover:not(.active) { border-color: var(--border2); color: var(--text); }

  /* Main */
  .main { padding: 16px; max-width: 480px; margin: 0 auto; }

  /* Session header (NEW v2) */
  .sess-header { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 12px 14px; margin-bottom: 12px; }
  .sess-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sess-title { font-size: 17px; font-weight: 600; }
  .sess-focus { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .sess-meta-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .sess-meta-item { background: var(--surface2); border-radius: 6px; padding: 7px 9px; }
  .sess-meta-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  .sess-meta-input { background: transparent; border: none; color: var(--text); font-size: 14px; font-weight: 600; width: 100%; padding: 0; -moz-appearance: textfield; }
  .sess-meta-input::-webkit-inner-spin-button, .sess-meta-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .sess-meta-input:focus { outline: none; color: var(--amber); }
  .sess-meta-suffix { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 2px; }

  /* Recovery alerts */
  .recovery-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); }
  .rec-pill { font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: 500; letter-spacing: 0.02em; }
  .rec-pill-ok { background: rgba(99,153,34,0.15); color: var(--green-light); border: 0.5px solid rgba(99,153,34,0.3); }
  .rec-pill-warn { background: rgba(239,159,39,0.12); color: var(--amber-light); border: 0.5px solid rgba(239,159,39,0.25); }
  .rec-pill-danger { background: rgba(226,75,74,0.12); color: var(--red-light); border: 0.5px solid rgba(226,75,74,0.3); }

  /* Progress strip */
  .progress-strip { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 8px 12px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); }
  .progress-text { font-size: 12px; color: var(--muted); }
  .progress-text strong { color: var(--text); font-weight: 600; }
  .progress-bar { flex: 1; height: 4px; background: var(--surface2); border-radius: 2px; margin: 0 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--amber); border-radius: 2px; transition: width 0.3s ease; }

  /* Exercise card */
  .ex-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; transition: border-color 0.15s; }
  .ex-card.completed { border-color: rgba(99,153,34,0.35); }
  .ex-header { padding: 12px 14px 10px; cursor: pointer; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; user-select: none; -webkit-tap-highlight-color: transparent; }
  .ex-num { font-size: 11px; color: var(--amber); font-weight: 600; min-width: 20px; margin-top: 1px; }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-size: 14px; font-weight: 500; line-height: 1.3; }
  .ex-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ex-chevron { font-size: 12px; color: var(--muted); transition: transform 0.2s; min-width: 16px; text-align: right; margin-top: 2px; }
  .ex-card.open .ex-chevron { transform: rotate(180deg); }
  .ex-pr { font-size: 11px; color: var(--amber-light); background: rgba(239,159,39,0.12); border-radius: 4px; padding: 2px 7px; display: inline-block; margin-top: 4px; }
  .ex-last { font-size: 10px; color: var(--muted); margin-top: 3px; opacity: 0.8; }
  .ex-emg { font-size: 9px; color: var(--purple); margin-top: 3px; opacity: 0.7; letter-spacing: 0.02em; }

  /* Sets area */
  .sets-area { border-top: 0.5px solid var(--border); padding: 10px 14px 14px; display: none; }
  .ex-card.open .sets-area { display: block; }

  .sets-grid { display: grid; grid-template-columns: 24px 1fr 1fr 50px 32px; gap: 5px; align-items: center; margin-bottom: 6px; }
  .sets-label { font-size: 10px; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: 0.04em; }
  .sets-label:first-child { text-align: left; }

  .set-row { display: grid; grid-template-columns: 24px 1fr 1fr 50px 32px; gap: 5px; align-items: center; margin-bottom: 5px; }
  .set-num { font-size: 12px; color: var(--muted); font-weight: 500; text-align: center; }
  .set-input { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 6px; color: var(--text); font-size: 14px; font-weight: 500; text-align: center; padding: 7px 2px; width: 100%; -moz-appearance: textfield; }
  .set-input::-webkit-inner-spin-button, .set-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .set-input:focus { outline: none; border-color: var(--amber); background: rgba(239,159,39,0.06); }
  .set-input::placeholder { color: rgba(255,255,255,0.18); font-weight: 400; }
  /* Valor pré-preenchido do histórico — âmbar suave, escurece ao editar */
  .set-input.historic { color: var(--amber-dark); border-color: rgba(239,159,39,0.2); }
  .set-input.historic:focus { color: var(--text); border-color: var(--amber); }

  /* RIR button compact */
  .rir-btn { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 6px; color: var(--muted); font-size: 11px; font-weight: 600; padding: 7px 0; cursor: pointer; transition: all 0.1s; -webkit-tap-highlight-color: transparent; }
  .rir-btn:active { transform: scale(0.95); }
  .rir-btn.set { background: rgba(160,122,204,0.18); border-color: rgba(160,122,204,0.4); color: var(--purple); }

  .set-check { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--border2); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.15s; color: transparent; margin: auto; -webkit-tap-highlight-color: transparent; }
  .set-check.done { background: var(--green); border-color: var(--green); color: white; }
  .set-check:active { transform: scale(0.92); }

  .set-note { font-size: 11px; color: var(--muted); margin-top: 6px; padding: 6px 8px; font-style: italic; background: var(--surface2); border-radius: 6px; line-height: 1.4; }

  /* RIR picker modal */
  .rir-picker-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
  .rir-picker-overlay.visible { opacity: 1; pointer-events: auto; }
  .rir-picker { background: var(--surface); border: 0.5px solid var(--border2); border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 18px 16px calc(20px + var(--safe-bottom)); width: 100%; max-width: 480px; transform: translateY(100%); transition: transform 0.2s ease-out; }
  .rir-picker-overlay.visible .rir-picker { transform: translateY(0); }
  .rir-picker-title { font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  .rir-picker-subtitle { font-size: 11px; color: var(--muted); margin-bottom: 14px; opacity: 0.7; }
  .rir-picker-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .rir-opt { padding: 14px 0; border-radius: 8px; background: var(--surface2); border: 0.5px solid var(--border2); color: var(--text); font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; transition: all 0.1s; }
  .rir-opt:active { transform: scale(0.92); }
  .rir-opt.danger { color: var(--red-light); border-color: rgba(226,75,74,0.35); }
  .rir-opt.warn { color: var(--amber-light); border-color: rgba(239,159,39,0.3); }
  .rir-opt.ok { color: var(--green-light); border-color: rgba(99,153,34,0.3); }
  .rir-opt.clear { color: var(--muted); }
  .rir-picker-foot { font-size: 10px; color: var(--muted); margin-top: 10px; text-align: center; opacity: 0.6; line-height: 1.5; }

  /* Timer (countdown v2) */
  .timer-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 0.5px solid var(--border); }
  .timer-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .timer-display { font-size: 17px; font-weight: 700; min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .timer-display.idle { color: var(--muted); }
  .timer-display.running { color: var(--amber); }
  .timer-display.overtime { color: var(--red); animation: pulse 1s ease-in-out infinite; }
  .timer-display.done { color: var(--green-light); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  .timer-btn { padding: 7px 14px; border-radius: 18px; font-size: 12px; font-weight: 600; cursor: pointer; border: 0.5px solid; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
  .timer-btn:active { transform: scale(0.95); }
  .timer-start { background: rgba(239,159,39,0.12); color: var(--amber-light); border-color: rgba(239,159,39,0.3); }
  .timer-stop { background: rgba(226,75,74,0.12); color: var(--red); border-color: rgba(226,75,74,0.3); display: none; }

  /* Summary cards */
  .summary-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 14px; margin-bottom: 10px; }
  .summary-title { font-size: 13px; color: var(--muted); margin-bottom: 12px; font-weight: 500; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-box { background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
  .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-value.amber { color: var(--amber); }
  .stat-value.green { color: var(--green-light); }
  .stat-value.blue { color: var(--blue); }
  .stat-value.teal { color: var(--teal); }
  .stat-value.purple { color: var(--purple); }
  .stat-value.red { color: var(--red-light); }

  /* History */
  .history-section { margin-top: 20px; }
  .section-title { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .hist-item { background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  .hist-date { font-size: 12px; color: var(--muted); }
  .hist-meta { font-size: 13px; font-weight: 500; }
  .hist-detail { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Finish button */
  .finish-btn { width: 100%; padding: 14px; border-radius: var(--r); background: var(--amber); color: #1a1a1a; font-size: 15px; font-weight: 700; cursor: pointer; border: none; margin-top: 16px; letter-spacing: 0.02em; transition: opacity 0.15s; -webkit-tap-highlight-color: transparent; }
  .finish-btn:active { opacity: 0.8; }
  .finish-btn:disabled { opacity: 0.4; cursor: default; }

  /* Charts */
  .chart-section { margin-top: 20px; }
  .chart-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
  .chart-title { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }
  .chart-wrap { position: relative; width: 100%; }
  canvas.chart { width: 100% !important; display: block; }
  .chart-select { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 6px; color: var(--text); font-size: 12px; padding: 5px 8px; cursor: pointer; margin-bottom: 10px; }
  .chart-select:focus { outline: none; border-color: var(--amber); }
  .chart-empty { font-size: 13px; color: var(--muted); padding: 20px 0; text-align: center; }

  /* Sub-tabs inside Histórico */
  .subtabs { display: flex; gap: 0; margin-bottom: 20px; border: 0.5px solid var(--border2); border-radius: var(--r); overflow: hidden; }
  .subtab { flex: 1; padding: 9px 0; font-size: 12px; font-weight: 500; cursor: pointer; background: transparent; color: var(--muted); border: none; transition: all 0.15s; text-align: center; -webkit-tap-highlight-color: transparent; }
  .subtab + .subtab { border-left: 0.5px solid var(--border2); }
  .subtab.active { background: var(--surface2); color: var(--text); }
  .subtab:hover:not(.active) { color: var(--text); }

  /* Volume MEV/MAV/MRV bar */
  .vol-row { background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
  .vol-row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .vol-muscle { font-size: 13px; font-weight: 600; }
  .vol-num { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .vol-num.below { color: var(--muted); }
  .vol-num.optimal { color: var(--green-light); }
  .vol-num.over { color: var(--red); }
  .vol-bar { position: relative; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .vol-bar-fill { height: 100%; transition: width 0.4s ease; }
  .vol-bar-mev, .vol-bar-mav, .vol-bar-mrv { position: absolute; top: -3px; bottom: -3px; width: 1.5px; background: rgba(255,255,255,0.45); }
  .vol-bar-mev::after, .vol-bar-mav::after, .vol-bar-mrv::after { content: attr(data-l); position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--muted); }
  .vol-row-foot { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 18px; }

  /* CSV export panel */
  .export-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
  .export-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .export-desc { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 14px; }
  .export-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .export-pill { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--surface2); border: 0.5px solid var(--border2); color: var(--muted); }
  .export-btn { display: block; width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; text-align: center; transition: opacity 0.15s; margin-bottom: 8px; -webkit-tap-highlight-color: transparent; }
  .export-btn:active { opacity: 0.8; }
  .export-btn-primary { background: var(--amber); color: #1a1a1a; }
  .export-btn-secondary { background: var(--surface2); color: var(--text); border: 0.5px solid var(--border2); }
  .export-btn:disabled { opacity: 0.35; cursor: default; }
  .export-preview { background: var(--surface2); border-radius: 6px; padding: 10px; font-size: 10px; color: var(--muted); font-family: monospace; overflow-x: auto; white-space: pre; line-height: 1.6; margin-top: 12px; border: 0.5px solid var(--border); }
  .col-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
  .col-table th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 6px; border-bottom: 0.5px solid var(--border2); }
  .col-table td { padding: 5px 6px; border-bottom: 0.5px solid var(--border); color: var(--text); vertical-align: top; }
  .col-table td:first-child { color: var(--amber-light); font-family: monospace; white-space: nowrap; }
  .col-table td:last-child { color: var(--muted); }

  /* Config card */
  .config-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
  .config-row { display: grid; grid-template-columns: 1fr 130px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
  .config-row:last-of-type { border-bottom: none; }
  .config-label { font-size: 13px; }
  .config-label-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .config-input { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 6px; color: var(--text); font-size: 13px; padding: 8px 10px; width: 100%; }
  .config-input:focus { outline: none; border-color: var(--amber); }

  /* Toast */
  .toast { position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 24px; padding: 10px 18px; font-size: 13px; color: var(--text); z-index: 300; opacity: 0; transition: all 0.25s ease; pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5); max-width: calc(100vw - 32px); }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: rgba(99,153,34,0.4); }
  .toast.warn { border-color: rgba(239,159,39,0.4); }
  .toast.error { border-color: rgba(226,75,74,0.4); }

  /* Session summary overlay */
  .session-summary-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.78); z-index: 250; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; transition: opacity 0.18s; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); overflow-y: auto; }
  .session-summary-overlay.visible { opacity: 1; }
  .session-summary { background: var(--surface); border: 0.5px solid var(--border2); border-radius: 16px; padding: 20px 18px calc(20px + var(--safe-bottom)); width: 100%; max-width: 440px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); transform: scale(0.94); transition: transform 0.22s ease-out; max-height: calc(100vh - 32px); overflow-y: auto; }
  .session-summary-overlay.visible .session-summary { transform: scale(1); }
  .summary-hero { text-align: center; padding: 12px 0 18px; border-bottom: 0.5px solid var(--border); margin-bottom: 16px; }
  .summary-hero-icon { font-size: 36px; line-height: 1; margin-bottom: 6px; }
  .summary-hero-title { font-size: 20px; font-weight: 700; color: var(--text); }
  .summary-hero-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .summary-stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .summary-stat-box { background: var(--surface2); border-radius: 10px; padding: 12px 8px; text-align: center; }
  .summary-stat-num { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1; }
  .summary-stat-lbl { font-size: 10px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .summary-section { background: var(--surface2); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .summary-section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; font-weight: 600; }
  .summary-pr-row, .summary-muscle-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; gap: 10px; }
  .summary-pr-row + .summary-pr-row, .summary-muscle-row + .summary-muscle-row { border-top: 0.5px solid var(--border); }
  .summary-pr-name, .summary-muscle-name { color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .summary-pr-val { color: var(--amber-light); font-weight: 600; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .summary-muscle-val { color: var(--purple); font-size: 11px; font-weight: 500; white-space: nowrap; }
  .summary-next { display: flex; align-items: center; justify-content: space-between; }
  .summary-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .summary-btn { padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.12s; -webkit-tap-highlight-color: transparent; }
  .summary-btn:active { transform: scale(0.97); }
  .summary-btn-primary { background: var(--amber); color: #1a1a1a; }
  .summary-btn-secondary { background: var(--surface2); color: var(--text); border: 0.5px solid var(--border2); }

  /* Selo "finalizado hoje" no header do treino */
  .sess-done-badge { display: inline-block; margin-top: 6px; font-size: 10px; padding: 3px 9px; border-radius: 12px; background: rgba(99,153,34,0.15); color: var(--green-light); border: 0.5px solid rgba(99,153,34,0.35); font-weight: 500; letter-spacing: 0.02em; }

  /* Danger zone */
  .danger-zone { background: rgba(226,75,74,0.06); border: 0.5px solid rgba(226,75,74,0.2); border-radius: var(--r); padding: 14px 16px; margin-top: 24px; }
  .danger-title { font-size: 11px; color: var(--red); font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
  .danger-desc { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  .danger-confirm { background: var(--surface2); border: 0.5px solid rgba(226,75,74,0.35); border-radius: 8px; padding: 12px 14px; margin-top: 10px; display: none; }
  .danger-confirm.visible { display: block; }
  .danger-confirm-text { font-size: 12px; color: var(--red-light); margin-bottom: 10px; line-height: 1.5; }
  .danger-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-cancel { padding: 9px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; background: var(--surface); border: 0.5px solid var(--border2); color: var(--muted); }
  .btn-delete { padding: 9px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--red); border: none; color: #fff; }
  .btn-trigger-delete { width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; background: transparent; border: 0.5px solid rgba(226,75,74,0.4); color: var(--red); transition: background 0.15s; }
  .btn-trigger-delete:hover { background: rgba(226,75,74,0.08); }

  .spacer { height: 24px; }
  /* Notes */
  .sess-notes-wrap { margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); }
  .sess-notes-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .sess-notes-input { background: transparent; border: none; color: var(--muted); font-size: 12px; width: 100%; resize: none; line-height: 1.5; font-family: inherit; padding: 0; }
  .sess-notes-input:focus { outline: none; color: var(--text); }
  .sess-notes-input::placeholder { color: rgba(255,255,255,0.18); }

  @media (max-width: 380px) {
    .main { padding: 12px; }
    .ex-name { font-size: 13px; }
    .sets-grid, .set-row { grid-template-columns: 22px 1fr 1fr 44px 28px; gap: 4px; }
    .set-input { font-size: 13px; }
  }
</style>
</head>

//     vs soma direta de coeficiente em `getWeeklyVolume`).
//   - Regra Pelland-aderente: coef ≥0.75 → 1.0 · coef 0.40–0.74 → 0.5
//     · coef <0.40 → 0.
//
// P0 — RIR-weighted volume (Robinson 2024):
//   - Séries com RIR alto deixam de contar como volume efetivo cheio.
//   - Escala Robinson contínua: RIR 0–2 → 1.0 · RIR 3 → 0.9 ·
//     RIR 4 → 0.6 · RIR 5+ → 0.0 · RIR null → 1.0 (default permissivo).
//
// P1 — Landmarks recalibrados (Posição A — Hammarström 2020):
//   - MEV mantém ranges naturais RP (biogênese ribossomal expande teto,
//     não piso). MAV/MRV recebem +30% para contexto enhanced.
//   - Valores agora conferem matematicamente contra e-books RP por

//
// P2 — Janela de microciclo (8 dias rolling):
//   - `getWeeklyVolume` agora opera em janela de 8 dias para alinhar

//     ≈ semana RP equivalente).
//
// P2 — Alerta overshoot por sessão (Remmert 2025):
//   - Limite empírico ~10 séries efetivas/grupo/sessão. Toast em tempo

//

//

//
// Compatibilidade: schemaVersion: 5. localStorage keys v2 preservadas.

function vibrate(pattern) {
  if (!CONFIG.haptic_enabled) return;
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
}
let _audioCtx = null;
function getAudioCtx() {
  if (!CONFIG.beep_enabled) return null;
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === "suspended") _audioCtx.resume();
    return _audioCtx;
  } catch(e) { return null; }
}
function beep(freq = 880, durMs = 220, vol = 0.18) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = "sine";
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.015);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + durMs/1000);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + durMs/1000 + 0.05);
  } catch(e) {}
}

// ─── CÁLCULOS FISIOLÓGICOS ────────────────────────────────────
// v3.1 — e1RM condicional: Epley para reps ≤ 12, Lombardi acima.
// Epley superestima em reps elevadas; Lombardi (load × reps^0.10) é
// mais precisa para 12+ reps. Acima de 20 reps a estimativa é
// suprimida (retorna 0) porque qualquer modelo perde validade.
function epley1RM(load, reps) {
  if (!load || !reps) return 0;
  if (reps === 1) return load;
  if (reps > 20) return 0;                          // estimativa não confiável
  if (reps <= 12) return load * (1 + reps / 30);    // Epley
  return load * Math.pow(reps, 0.10);               // Lombardi (reps 13–20)
}

// ─── FRACTIONAL COUNTING UNIFICADO (Pelland 2026 + Robinson 2024) ──
// Threshold Pelland-aderente para coeficiente EMG:
//   coef ≥ 0.75 → 1.0 série · coef 0.40–0.74 → 0.5 série · coef < 0.40 → 0
const EFFECTIVE_THRESHOLD_FULL = 0.75;
const EFFECTIVE_THRESHOLD_HALF = 0.40;

function fractionFromCoef(coef) {
  if (coef >= EFFECTIVE_THRESHOLD_FULL) return 1.0;
  if (coef >= EFFECTIVE_THRESHOLD_HALF) return 0.5;
  return 0;
}

// Escala RIR contínua (Robinson 2024):
//   RIR 0–2: 1.0 · RIR 3: 0.9 · RIR 4: 0.6 · RIR 5+: 0.0
//   RIR null/undefined: 1.0 (default permissivo)
function rirWeight(rir) {
  if (rir === null || rir === undefined || rir === '') return 1.0;
  const r = parseInt(rir);
  if (isNaN(r)) return 1.0;
  if (r <= 2) return 1.0;
  if (r === 3) return 0.9;
  if (r === 4) return 0.6;
  return 0.0;  // RIR ≥ 5
}

// Função unificada: para uma série (exId + grupo + RIR), retorna a
// fração de série efetiva que ela contribui ao volume do grupo.
function effectiveSetFraction(exId, group, rir) {
  const coef = EMG_COEFFICIENTS[exId];
  if (!coef || coef[group] === undefined) return 0;
  return fractionFromCoef(coef[group]) * rirWeight(rir);
}

// Volume EMG-weighted (kg ponderado): para cada exercício, distribui (load × reps) entre grupos via coeficiente
function emgWeightedSetVolume(exId, load, reps) {
  const coef = EMG_COEFFICIENTS[exId];
  if (!coef) return {};
  const vol = (load || 0) * (reps || 0);
  const out = {};
  Object.keys(coef).forEach(grp => { out[grp] = vol * coef[grp]; });
  return out;
}

// Última sessão por exercício (auto-fill carga + last-trained timestamp)
function getLastExerciseData(hist, exId) {
  for (let i = hist.length - 1; i >= 0; i--) {
    const sets = hist[i].exSets?.[exId];
    if (sets && sets.length > 0) {
      const completed = sets.filter(s => s.done && s.load > 0);
      if (completed.length > 0) {
        const maxLoad = Math.max(...completed.map(s => s.load));
        const topSet = completed.find(s => s.load === maxLoad);
        return {
          date: hist[i].date,
          ts: hist[i].ts,
          topLoad: maxLoad,
          topReps: topSet?.reps || 0,
          allSets: sets
        };
      }
    }
  }
  return null;
}

// Última vez que cada grupo muscular foi treinado (ts em ms)
// Usa threshold fractional: grupo "treinado" se recebeu ≥0.5 série
// efetiva (coef ≥ 0.40) — alinhado ao threshold Pelland.
function getMuscleLastTrained(hist) {
  const out = {};
  for (let i = hist.length - 1; i >= 0; i--) {
    const h = hist[i];
    if (!h.exSets) continue;
    Object.keys(h.exSets).forEach(exId => {
      const coef = EMG_COEFFICIENTS[exId];
      if (!coef) return;
      const hadCompletedSet = h.exSets[exId].some(s => s.done);
      if (!hadCompletedSet) return;
      Object.keys(coef).forEach(grp => {
        if (coef[grp] >= EFFECTIVE_THRESHOLD_HALF && !out[grp]) {
          out[grp] = h.ts;
        }
      });
    });
  }
  return out;
}

// Volume rolling de microciclo por grupo muscular (séries efetivas RIR-weighted)
// v3.1: janela default = 8 dias (alinha ao ciclo 3 on/1 off do Marcel,
// ~6 sessões treinadas ≈ semana RP equivalente). Mantém assinatura
// retrocompatível: getWeeklyVolume(hist, 1) → 8 dias; (hist, 2) → 16 dias.
const MICROCYCLE_WINDOW_DAYS = 8;
function getWeeklyVolume(hist, weeksBack = 1) {
  const cutoff = Date.now() - (weeksBack * MICROCYCLE_WINDOW_DAYS * 86400000);
  const totals = {};
  Object.keys(VOLUME_LANDMARKS_BASE).forEach(g => { totals[g] = 0; });
  hist.forEach(h => {
    if (!h.ts || h.ts < cutoff || !h.exSets) return;
    Object.keys(h.exSets).forEach(exId => {
      const coef = EMG_COEFFICIENTS[exId];
      if (!coef) return;
      h.exSets[exId].forEach(s => {
        if (!s.done) return;
        const rirW = rirWeight(s.rir);
        Object.keys(coef).forEach(grp => {
          if (totals[grp] === undefined) return;
          totals[grp] += fractionFromCoef(coef[grp]) * rirW;
        });
      });
    });
  });
  return totals;
}

// Status MEV/MAV/MRV (consulta landmarks ajustados por deload)
function volumeStatus(value, landmarks) {
  if (value < landmarks.mev) return { tier: "below", label: "Sub-MEV", color: "below" };
  if (value < landmarks.mav) return { tier: "mev", label: "MEV→MAV", color: "below" };
  if (value <= landmarks.mrv) return { tier: "optimal", label: "MAV", color: "optimal" };
  return { tier: "over", label: ">MRV", color: "over" };
}

    renderHistory(main);
    return;
  }
  if (currentTab === "⚙️") {
    renderConfig(main);
    return;
  }

  renderTreino(main);
}

function renderTreino(main) {
  const t = TREINOS[currentTab];
  const hist = loadHistory();
  const prs = loadPRs();
  const muscleLastTrained = getMuscleLastTrained(hist);

  // Header da sessão (peso corporal, sleep, cardio)
  const draftKey = "draft_" + currentTab;
  const draft = loadDraft(draftKey);

  // Detecta se já há sessão deste treino finalizada hoje
  const todayStr = today();
  const doneToday = hist.slice().reverse().find(h => h.treino === currentTab && h.date === todayStr) || null;

  // Melhoria 2: dias desde o último treino do mesmo tipo
  const lastSameType = hist.slice().reverse().find(h => h.treino === currentTab && h.date !== today());
  const daysSinceLabel = (() => {
    if (!lastSameType) return null;
    const diff = dayDiff(lastSameType.date.split('/').reverse().join('-'), todayISO());
    return diff > 0 ? `${diff}d atrás · ${lastSameType.totalSets}s · ${(lastSameType.totalLoad/1000).toFixed(1)}t` : null;
  })();

  let html = `<div class="sess-header">
    <div class="sess-header-top">
      <div>
        <div class="sess-title">${t.label}</div>
        <div class="sess-focus">🎯 ${t.focus} · Rec ${t.rec}${daysSinceLabel ? ` · <span style="color:var(--blue);font-size:10px;">⟳ ${daysSinceLabel}</span>` : ''}</div>
        ${doneToday ? `<span class="sess-done-badge">✓ Finalizado hoje · ${doneToday.totalSets} séries · ${(doneToday.totalLoad/1000).toFixed(1)}t</span>` : ''}
      </div>
    </div>
    <div class="sess-meta-grid">
      <div class="sess-meta-item">
        <div class="sess-meta-label">Peso (kg)</div>
        <input type="number" class="sess-meta-input" id="meta_bw" inputmode="decimal" step="0.1"
               placeholder="—" value="${draft.bodyweight || ''}" oninput="saveDraftField('bodyweight', this.value)">
      </div>
      <div class="sess-meta-item">
        <div class="sess-meta-label">Sono (h)</div>
        <input type="number" class="sess-meta-input" id="meta_sleep" inputmode="decimal" step="0.5"
               placeholder="—" value="${draft.sleep_hours || ''}" oninput="saveDraftField('sleep_hours', this.value)">
      </div>
      <div class="sess-meta-item">
        <div class="sess-meta-label">Cardio (min)</div>
        <input type="number" class="sess-meta-input" id="meta_cardio" inputmode="numeric"
               placeholder="${CONFIG.cardio_min_default}" value="${draft.cardio_min || ''}" oninput="saveDraftField('cardio_min', this.value)">
      </div>
    </div>
    ${renderRecoveryStrip(t, muscleLastTrained)}
    <div class="sess-notes-wrap">
      <div class="sess-notes-label">Observações da sessão</div>
      <textarea class="sess-notes-input" id="meta_notes" rows="2"
        placeholder="Dor articular, sono, injeção, intercorrências..."
        oninput="saveDraftField('notes', this.value)">${draft.notes || ''}</textarea>
    </div>
  </div>`;

  // Progress strip
  const progressData = computeSessionProgress(t, draft);
  html += `<div class="progress-strip">
    <span class="progress-text"><strong>${progressData.done}</strong>/${progressData.total} séries</span>
    <div class="progress-bar"><div class="progress-fill" style="width:${progressData.pct}%"></div></div>
    <span class="progress-text" id="prog-vol"><strong>${Math.round(progressData.totalVol)}</strong>kg</span>
  </div>`;

  // Exercise cards
  t.exercises.forEach((ex, idx) => {
    const prData = prs[ex.id];
    const last = getLastExerciseData(hist, ex.id);
    const isOpen = openExId === ex.id;
    const exDraft = draft.sets?.[ex.id] || {};
    const completedCount = ex.sets.filter((_, si) => exDraft[`c${si}`] === "1").length;
    const isExCompleted = completedCount === ex.sets.length;

    const prText = prData ? `PR: ${prData.load}kg × ${prData.reps} (e1RM ${prData.e1rm.toFixed(1)})` : "Sem PR registrado";
    const lastText = last ? `Última: ${last.topLoad}kg × ${last.topReps} · ${last.date}` : "";
    const emgText = formatEMGSummary(ex.id);

    let setsHTML = `<div class="sets-grid">
      <div class="sets-label">#</div>
      <div class="sets-label">Carga</div>
      <div class="sets-label">Reps</div>
      <div class="sets-label">RIR</div>
      <div class="sets-label">✓</div>
    </div>`;

    ex.sets.forEach((s, si) => {
      const baseId = `${ex.id}_s${si}`;
      const checkId = `${ex.id}_c${si}`;
      const rirId = `${ex.id}_rir${si}`;
      // Bug 1+2 fix + Melhoria 1: pré-preenche value com histórico por série
      // Draft tem prioridade; se draft vazio, usa histórico da série correspondente
      const histSet = last?.allSets?.[si];
      const histLoad = histSet?.load > 0 ? String(histSet.load) : (last ? String(last.topLoad) : '');
      const histReps = histSet?.reps > 0 ? String(histSet.reps) : '';
      const loadVal = exDraft[`s${si}_load`] !== undefined && exDraft[`s${si}_load`] !== ''
        ? exDraft[`s${si}_load`]
        : histLoad;
      const repsVal = exDraft[`s${si}_reps`] !== undefined && exDraft[`s${si}_reps`] !== ''
        ? exDraft[`s${si}_reps`]
        : histReps;
      const rirVal = exDraft[`s${si}_rir`];
      const isDone = exDraft[`c${si}`] === "1";
      // Indica visualmente que o valor é pré-preenchido do histórico (não digitado hoje)
      const isHistoricLoad = loadVal && loadVal === histLoad && !(exDraft[`s${si}_load`]);
      const isHistoricReps = repsVal && repsVal === histReps && !(exDraft[`s${si}_reps`]);
      setsHTML += `<div class="set-row">
        <div class="set-num">${si+1}</div>
        <input type="number" inputmode="decimal" class="set-input${isHistoricLoad ? ' historic' : ''}" id="${baseId}_load" placeholder="—" step="0.5" min="0"
               value="${loadVal}">
        <input type="number" inputmode="numeric" class="set-input${isHistoricReps ? ' historic' : ''}" id="${baseId}_reps" placeholder="${s.reps}" min="0"
               value="${repsVal}">
        <button class="rir-btn ${rirVal !== undefined && rirVal !== null && rirVal !== '' ? 'set' : ''}" id="${rirId}"
                onclick="openRIRPicker('${ex.id}',${si})">${rirVal !== undefined && rirVal !== null && rirVal !== '' ? rirVal : '—'}</button>
        <div class="set-check ${isDone ? 'done' : ''}" id="${checkId}" onclick="toggleCheck('${ex.id}',${si})">✓</div>
      </div>`;
    });

    if (ex.note) setsHTML += `<div class="set-note">ℹ ${ex.note}</div>`;

    // Timer countdown row
    const timerState = timers[ex.id];
    const timerClass = timerState ? (timerState.elapsed > timerState.target ? "overtime" : "running") : "idle";
    const timerText = timerState ? fmtMMSS(timerState.target - timerState.elapsed) : fmtMMSS(t.restSec);
    setsHTML += `<div class="timer-row">
      <div class="timer-label">Descanso (${t.rec})</div>
      <div class="timer-display ${timerClass}" id="timer_${ex.id}">${timerText}</div>
      <button class="timer-btn timer-start" id="tstart_${ex.id}" onclick="startTimer('${ex.id}',${t.restSec})" style="display:${timerState?'none':'block'};">Iniciar</button>
      <button class="timer-btn timer-stop" id="tstop_${ex.id}" onclick="stopTimer('${ex.id}')" style="display:${timerState?'block':'none'};">Stop</button>
    </div>`;

    html += `<div class="ex-card ${isOpen ? 'open' : ''} ${isExCompleted ? 'completed' : ''}" id="excard_${ex.id}">
      <div class="ex-header" onclick="toggleEx('${ex.id}')">
        <div class="ex-num">${idx+1}</div>
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-meta">${ex.sets.length} séries · ${ex.sets.map(s=>s.reps).join(' / ')} reps · ${completedCount}/${ex.sets.length} ✓</div>
          <div class="ex-pr">${prText}</div>
          ${lastText ? `<div class="ex-last">${lastText}</div>` : ''}
          ${emgText ? `<div class="ex-emg">${emgText}</div>` : ''}
        </div>
        <div class="ex-chevron">▼</div>
      </div>
      <div class="sets-area">${setsHTML}</div>
    </div>`;
  });

  html += `<button class="finish-btn" onclick="finishSession()">Finalizar Treino ${currentTab}</button>`;
  html += `<div class="spacer"></div>`;

  main.innerHTML = html;

  // Bug 5 fix: re-sincroniza displays de timers ativos após rebuild do DOM
  Object.keys(timers).forEach(exId => {
    const tk = timers[exId];
    if (!tk) return;
    const display = $id("timer_" + exId);
    const btnStart = $id("tstart_" + exId);
    const btnStop  = $id("tstop_"  + exId);
    if (!display) return;
    tk.elapsed = Math.floor((Date.now() - tk.startMs) / 1000);
    const remaining = tk.target - tk.elapsed;
    display.textContent = fmtMMSS(remaining);
    display.className = "timer-display " + (remaining > 0 ? "running" : "overtime");
    if (btnStart) btnStart.style.display = "none";
    if (btnStop)  btnStop.style.display  = "block";
  });
}

function formatEMGSummary(exId) {
  const coef = EMG_COEFFICIENTS[exId];
  if (!coef) return '';
  const sorted = Object.entries(coef).sort((a,b) => b[1]-a[1]).slice(0, 3);
  return sorted.map(([g,v]) => `${VOLUME_LANDMARKS[g]?.label || g}:${v.toFixed(2)}`).join(' · ');
}

function renderRecoveryStrip(t, muscleLastTrained) {
  // Identifica os 3 grupos primários do treino atual e checa recovery status
  const primaryGroups = new Set();
  t.exercises.forEach(ex => {
    const coef = EMG_COEFFICIENTS[ex.id];
    if (!coef) return;
    Object.entries(coef).forEach(([g, v]) => { if (v >= 0.7) primaryGroups.add(g); });
  });
  const pills = [];
  Array.from(primaryGroups).slice(0, 6).forEach(grp => {
    const lastTs = muscleLastTrained[grp];
    const minHours = RECOVERY_HOURS[grp] || 48;
    const label = VOLUME_LANDMARKS[grp]?.label || grp;
    if (!lastTs) {
      pills.push(`<span class="rec-pill rec-pill-ok">${label} · novo</span>`);
      return;
    }
    const h = hoursSince(lastTs);
    if (h >= minHours) {
      pills.push(`<span class="rec-pill rec-pill-ok">${label} · ${Math.round(h)}h ✓</span>`);
    } else if (h >= minHours * 0.75) {
      pills.push(`<span class="rec-pill rec-pill-warn">${label} · ${Math.round(h)}h ⚠</span>`);
    } else {
      pills.push(`<span class="rec-pill rec-pill-danger">${label} · ${Math.round(h)}h ✗</span>`);
    }
  });
  if (pills.length === 0) return '';
  return `<div class="recovery-strip">${pills.join('')}</div>`;
}

function computeSessionProgress(t, draft) {
  let total = 0, done = 0, totalVol = 0;
  t.exercises.forEach(ex => {
    total += ex.sets.length;
    const exDraft = draft.sets?.[ex.id] || {};
    ex.sets.forEach((_, si) => {
      if (exDraft[`c${si}`] === "1") {
        done++;
        const load = parseFloat(exDraft[`s${si}_load`]) || 0;
        const reps = parseInt(exDraft[`s${si}_reps`]) || 0;
        totalVol += load * reps;
      }
    });
  });
  return { total, done, pct: total ? Math.round(done/total*100) : 0, totalVol };
}

// ─── DRAFT (localStorage com chave de data — Bug 4 fix) ───────
function draftStorageKey(tabKey) {
  return DRAFT_KEY + "_" + tabKey + "_" + todayISO();
}
function loadDraft(key) {
  try {
    // key = "draft_A" → converte para nova chave com data
    const tab = key.replace("draft_", "");
    const lsKey = draftStorageKey(tab);
    const raw = localStorage.getItem(lsKey);
    if (!raw) return { sets: {} };
    const parsed = JSON.parse(raw);
    if (!parsed.sets) parsed.sets = {};
    return parsed;
  } catch(e) { return { sets: {} }; }
}
function saveDraft(key, data) {
  try {
    const tab = key.replace("draft_", "");
    const lsKey = draftStorageKey(tab);
    data._ts = Date.now();
    localStorage.setItem(lsKey, JSON.stringify(data));
  } catch(e) {}
}
function saveDraftField(field, value) {
  const key = "draft_" + currentTab;
  const d = loadDraft(key);
  d[field] = value;
  saveDraft(key, d);
}
function saveSetField(exId, setIdx, field, value) {
  const key = "draft_" + currentTab;
  const d = loadDraft(key);
  if (!d.sets[exId]) d.sets[exId] = {};
  d.sets[exId][`s${setIdx}_${field}`] = value;
  saveDraft(key, d);
  updateProgressIndicator();
}
function saveSetCheck(exId, setIdx, isDone) {
  const key = "draft_" + currentTab;
  const d = loadDraft(key);
  if (!d.sets[exId]) d.sets[exId] = {};
  d.sets[exId][`c${setIdx}`] = isDone ? "1" : "0";
  saveDraft(key, d);
}
function saveSetRIR(exId, setIdx, rir) {
  const key = "draft_" + currentTab;
  const d = loadDraft(key);
  if (!d.sets[exId]) d.sets[exId] = {};
  if (rir === null || rir === undefined) {
    delete d.sets[exId][`s${setIdx}_rir`];
  } else {
    d.sets[exId][`s${setIdx}_rir`] = rir;
  }
  saveDraft(key, d);
}

// Listener delegado: salva inputs sem re-renderizar (Bug 3 fix — regex genérico)
document.addEventListener("input", (e) => {
  const el = e.target;
  if (!el.classList.contains("set-input")) return;
  el.classList.remove("historic"); // valor agora é do dia — remove indicador
  const m = el.id.match(/^(.+)_s(\d+)_(load|reps)$/);
  if (m) saveSetField(m[1], parseInt(m[2]), m[3], el.value);
});

function updateProgressIndicator() {
  const t = TREINOS[currentTab];
  if (!t) return;
  const draft = loadDraft("draft_" + currentTab);
  const p = computeSessionProgress(t, draft);
  const fill = $q(".progress-fill");
  const dome = $q(".progress-text strong");
  const volEl = $id("prog-vol");
  if (fill) fill.style.width = p.pct + "%";
  if (dome) dome.textContent = p.done;
  if (volEl) volEl.innerHTML = `<strong>${Math.round(p.totalVol)}</strong>kg`;
}

// ─── TOGGLE EXPANSÃO (surgical, sem renderAll) ────────────────
function toggleEx(id) {
  const prev = openExId;
  openExId = openExId === id ? null : id;
  if (prev) {
    const prevCard = $id("excard_" + prev);
    if (prevCard) prevCard.classList.remove("open");
  }
  if (openExId) {
    const card = $id("excard_" + openExId);
    if (card) {
      card.classList.add("open");
      setTimeout(() => card.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
    }
  }
}

// ─── CHECK SÉRIE (surgical, sem renderAll) ────────────────────
function toggleCheck(exId, setIdx) {
  const checkId = `${exId}_c${setIdx}`;
  const el = $id(checkId);
  if (!el) return;
  const isDone = el.classList.toggle("done");
  saveSetCheck(exId, setIdx, isDone);
  beepClick();
  vibrate(20);

  // Atualiza counter no header do exercício e estado completed
  const t = TREINOS[currentTab];
  const ex = t.exercises.find(e => e.id === exId);
  if (ex) {
    const draft = loadDraft("draft_" + currentTab);
    const exDraft = draft.sets?.[exId] || {};
    const completedCount = ex.sets.filter((_, si) => exDraft[`c${si}`] === "1").length;
    const card = $id("excard_" + exId);
    if (card) {
      const meta = $q(".ex-meta", card);
      if (meta) {
        const newText = `${ex.sets.length} séries · ${ex.sets.map(s=>s.reps).join(' / ')} reps · ${completedCount}/${ex.sets.length} ✓`;
        meta.textContent = newText;
      }
      card.classList.toggle("completed", completedCount === ex.sets.length);
    }
  }

  // Atualiza PR se concluiu com dados + Melhoria 4: alerta de regressão
  if (isDone) {
    const loadEl = $id(`${exId}_s${setIdx}_load`);
    const repsEl = $id(`${exId}_s${setIdx}_reps`);
    const load = parseFloat(loadEl?.value) || 0;
    const reps = parseInt(repsEl?.value) || 0;
    if (load > 0 && reps > 0) {
      const pr = updatePR(exId, load, reps);
      if (pr) {
        showToast(`🏆 Novo PR · ${load}kg × ${reps} (e1RM ${pr.e1rm.toFixed(1)})`, "success");
      } else {
        // Melhoria 4: verifica regressão vs PR histórico
        const prs = loadPRs();
        const prevPR = prs[exId];
        if (prevPR && load < prevPR.load) {
          const diff = (prevPR.load - load).toFixed(1);
          showToast(`⚠️ Carga ${load}kg — ${diff}kg abaixo do PR (${prevPR.load}kg). Registrado.`, "warn");
        }
      }
    }
  }
  // v3.1 — Verificação de overshoot em tempo real (Remmert 2025)
  if (isDone) {
    checkOvershootRealtime();
  }
  updateProgressIndicator();
}

// v3.1 — Detecta em tempo real se algum grupo passou do threshold de overshoot
// durante a sessão atual. Dispara toast só na transição (não a cada série).
let _overshootWarned = {};
function checkOvershootRealtime() {
  const t = TREINOS[currentTab];
  const draft = loadDraft("draft_" + currentTab);
  const muscleSets = {};
  Object.keys(VOLUME_LANDMARKS_BASE).forEach(g => { muscleSets[g] = 0; });

  t.exercises.forEach(ex => {
    const exDraft = draft.sets?.[ex.id] || {};
    ex.sets.forEach((_, si) => {
      if (exDraft[`c${si}`] !== "1") return;
      const rir = exDraft[`s${si}_rir`];
      const coef = EMG_COEFFICIENTS[ex.id];
      if (!coef) return;
      const rirW = rirWeight(rir);
      Object.keys(coef).forEach(grp => {
        if (muscleSets[grp] === undefined) return;
        muscleSets[grp] += fractionFromCoef(coef[grp]) * rirW;
      });
    });
  });

  Object.keys(muscleSets).forEach(grp => {
    if (muscleSets[grp] > PER_SESSION_OVERSHOOT_THRESHOLD && !_overshootWarned[grp]) {
      _overshootWarned[grp] = true;
      const label = VOLUME_LANDMARKS_BASE[grp]?.label || grp;
      showToast(`⚠️ Overshoot ${label} — ${muscleSets[grp].toFixed(1)} séries efetivas nesta sessão (limite Remmert ~${PER_SESSION_OVERSHOOT_THRESHOLD})`, "warn");
    }
  });
}
function updatePR(exId, load, reps) {
  const prs = loadPRs();
  const prev = prs[exId];
  const e1rm = epley1RM(load, reps);
  const prevE1rm = prev ? prev.e1rm : 0;
  if (e1rm > prevE1rm) {
    prs[exId] = { load, reps, e1rm: +e1rm.toFixed(2), date: today(), ts: Date.now() };
    savePRs(prs);
    return prs[exId];
  }
  return null;
}

// ─── RIR PICKER ───────────────────────────────────────────────
function openRIRPicker(exId, setIdx) {
  rirPickerCtx = { exId, setIdx };
  const t = TREINOS[currentTab];
  const ex = t.exercises.find(e => e.id === exId);
  const ctx = $id("rir-context");
  if (ctx && ex) ctx.textContent = `${ex.name} · Série ${setIdx + 1}`;
  $id("rir-overlay").classList.add("visible");
  beepClick();
}
function closeRIRPicker(ev) {
  if (ev && ev.target.id !== "rir-overlay") return;
  $id("rir-overlay").classList.remove("visible");
  rirPickerCtx = null;
}
function setRIR(value) {
  if (!rirPickerCtx) return;
  const { exId, setIdx } = rirPickerCtx;
  saveSetRIR(exId, setIdx, value);
  // Atualiza botão visualmente sem re-render
  const btn = $id(`${exId}_rir${setIdx}`);
  if (btn) {
    if (value === null) {
      btn.textContent = "—";
      btn.classList.remove("set");
    } else {
      btn.textContent = value === 5 ? "5+" : String(value);
      btn.classList.add("set");
    }
  }
  vibrate(15);
  $id("rir-overlay").classList.remove("visible");
  rirPickerCtx = null;
}

// ─── TIMER COUNTDOWN COM BEEP + OVERTIME ──────────────────────
// Cada exercício tem timer próprio (mapa) — permite paralelo nos alternados
function startTimer(exId, targetSec) {
  // Para timer anterior do mesmo exercício se existir
  if (timers[exId]?.intervalId) clearInterval(timers[exId].intervalId);

  const display = $id("timer_" + exId);
  const btnStart = $id("tstart_" + exId);
  const btnStop = $id("tstop_" + exId);
  if (!display) return;

  // Inicializa AudioContext sob gesto do usuário (necessário em iOS)
  getAudioCtx();

  const startMs = Date.now();
  timers[exId] = { startMs, target: targetSec, elapsed: 0, beeped: false, intervalId: null };
  btnStart.style.display = "none";
  btnStop.style.display = "block";
  display.classList.remove("idle", "done", "overtime");
  display.classList.add("running");
  display.textContent = fmtMMSS(targetSec);

  timers[exId].intervalId = setInterval(() => {
    const tk = timers[exId];
    if (!tk) return;
    tk.elapsed = Math.floor((Date.now() - tk.startMs) / 1000);
    const remaining = tk.target - tk.elapsed;
    if (remaining > 0) {
      display.textContent = fmtMMSS(remaining);
    } else {
      // Atingiu zero
      if (!tk.beeped) {
        tk.beeped = true;
        beepDone();
        showToast(`⏱ Descanso completo · ${TREINOS[currentTab].exercises.find(e=>e.id===exId)?.name || exId}`, "success");
        display.classList.remove("running");
        display.classList.add("overtime");
      }
      // Continua contando overtime (negativo)
      display.textContent = fmtMMSS(remaining);
    }
  }, 250);
}
function stopTimer(exId) {
  const tk = timers[exId];
  if (tk?.intervalId) clearInterval(tk.intervalId);
  delete timers[exId];
  const display = $id("timer_" + exId);
  const btnStart = $id("tstart_" + exId);
  const btnStop = $id("tstop_" + exId);
  if (display) {
    const restSec = TREINOS[currentTab]?.restSec || 120;
    display.textContent = fmtMMSS(restSec);
    display.className = "timer-display idle";
  }
  if (btnStart) btnStart.style.display = "block";
  if (btnStop) btnStop.style.display = "none";
}

// ─── FINALIZAR SESSÃO ─────────────────────────────────────────
function finishSession() {
  const t = TREINOS[currentTab];
  const draft = loadDraft("draft_" + currentTab);
  const hist = loadHistory();
  const prs = loadPRs();

  let totalLoad = 0, totalSets = 0, prCount = 0;
  const exVolumes = {};       // exId → kg total
  const exSets = {};          // exId → array de objetos por série
  const muscleVolumes = {};   // grupo → kg ponderado por EMG
  const muscleSets = {};      // grupo → séries efetivas
  Object.keys(VOLUME_LANDMARKS).forEach(g => { muscleVolumes[g] = 0; muscleSets[g] = 0; });

  t.exercises.forEach(ex => {
    let exVol = 0;
    const setsData = [];
    const exDraft = draft.sets?.[ex.id] || {};
    ex.sets.forEach((s, si) => {
      const load = parseFloat(exDraft[`s${si}_load`]) || 0;
      const reps = parseInt(exDraft[`s${si}_reps`]) || 0;
      const rir = exDraft[`s${si}_rir`];
      const done = exDraft[`c${si}`] === "1" ? 1 : 0;
      const vol = load * reps;
      if (done) {
        totalLoad += vol;
        exVol += vol;
        totalSets++;
        // v3.1: distribui volume (kg ponderado) + séries efetivas (fractional+RIR) por grupo
        const coef = EMG_COEFFICIENTS[ex.id];
        if (coef) {
          const rirW = rirWeight(rir);
          Object.keys(coef).forEach(grp => {
            if (muscleVolumes[grp] !== undefined) {
              muscleVolumes[grp] += vol * coef[grp];
              muscleSets[grp] += fractionFromCoef(coef[grp]) * rirW;
            }
          });
        }
      }
      setsData.push({
        setNum: si + 1, load, reps,
        volume: Math.round(vol), done,
        targetReps: s.reps,
        rir: (rir === '' || rir === undefined) ? null : (rir === null ? null : parseInt(rir))
      });
    });
    if (exVol > 0) exVolumes[ex.id] = Math.round(exVol);
    exSets[ex.id] = setsData;
    if (prs[ex.id]?.date === today()) prCount++;
  });

  // v3.1 — Detecta overshoot por sessão (Remmert 2025)
  // Grupos que excederam PER_SESSION_OVERSHOOT_THRESHOLD séries efetivas
  const overshootGroups = [];
  Object.keys(muscleSets).forEach(grp => {
    if (muscleSets[grp] > PER_SESSION_OVERSHOOT_THRESHOLD) {
      overshootGroups.push({
        group: VOLUME_LANDMARKS_BASE[grp]?.label || grp,
        sets: Math.round(muscleSets[grp] * 10) / 10
      });
    }
  });

  // Validação anti-lixo (Bug 6 fix — detecta séries done sem carga/reps)
  if (totalSets === 0) {
    if (!confirm("⚠️ Nenhuma série foi marcada como concluída. Salvar mesmo assim?")) return;
  }
  // Avisa séries marcadas done com load=0 ou reps=0
  let ghostSets = 0;
  t.exercises.forEach(ex => {
    const exDraft = draft.sets?.[ex.id] || {};
    ex.sets.forEach((_, si) => {
      if (exDraft[`c${si}`] === "1") {
        const load = parseFloat(exDraft[`s${si}_load`]) || 0;
        const reps = parseInt(exDraft[`s${si}_reps`]) || 0;
        if (load === 0 || reps === 0) ghostSets++;
      }
    });
  });
  if (ghostSets > 0) {
    if (!confirm(`⚠️ ${ghostSets} série(s) marcada(s) como concluída(s) sem carga ou reps preenchidos. Essas séries serão salvas com volume zero. Continuar?`)) return;
  }

  const entry = {
    date: today(),
    treino: currentTab,
    treinoLabel: t.label,
    focus: t.focus,
    recTarget: t.rec,
    totalLoad: Math.round(totalLoad),
    totalSets,
    prCount,
    exVolumes,
    exSets,
    muscleVolumes: Object.fromEntries(Object.entries(muscleVolumes).map(([k,v])=>[k, Math.round(v*10)/10])),
    muscleSets:    Object.fromEntries(Object.entries(muscleSets).map(([k,v])=>[k, Math.round(v*100)/100])),
    bodyweight: parseFloat(draft.bodyweight) || null,
    sleep_hours: parseFloat(draft.sleep_hours) || null,
    cardio_min: parseInt(draft.cardio_min) || CONFIG.cardio_min_default,
    mesocycle: CONFIG.mesocycle,
    protocol_label: CONFIG.protocol_label,
    cycle_day: CONFIG.cycle_start_iso ? dayDiff(CONFIG.cycle_start_iso, todayISO()) : null,
    deload: CONFIG.deload_week ? 1 : 0,
    notes: draft.notes || '',  // Melhoria 5
    overshootGroups: overshootGroups,  // v3.1: Remmert 2025
    ts: Date.now(),
    schemaVersion: 5
  };
  hist.push(entry);
  saveHistory(hist);
  localStorage.removeItem(draftStorageKey(currentTab));
  _overshootWarned = {};  // v3.1: reseta tracking de overshoot p/ próxima sessão

  // Para todos os timers ativos
  Object.keys(timers).forEach(stopTimer);

  vibrate([60, 40, 60, 40, 100]);
  showSessionSummary(entry);
}

  const rotation = { A: "B", B: "C", C: "D", D: "A" };

  // Top 3 grupos musculares com mais séries efetivas na sessão

    .filter(([_, v]) => v >= 0.5)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([g, v]) => ({ group: VOLUME_LANDMARKS_BASE[g]?.label || g, sets: v }));

  // PRs batidos hoje (filtra dos prs salvos os que têm data = hoje E exercício pertence a este treino)
  const prs = loadPRs();

  const todayStr = today();

    .map(ex => ({ name: ex.name, pr: prs[ex.id] }))

            <div class="summary-stat-num">${(entry.totalLoad/1000).toFixed(1)}<span style="font-size:14px;">t</span></div>
            <div class="summary-stat-lbl">volume</div>

            <div class="summary-stat-num" style="color:var(--amber);">${prsHoje.length}</div>
            <div class="summary-stat-lbl">PR${prsHoje.length===1?'':'s'}</div>
          </div>
        </div>

        ${prsHoje.length > 0 ? `
          <div class="summary-section">
            <div class="summary-section-title">🏆 PRs batidos</div>
            ${prsHoje.map(x => `
              <div class="summary-pr-row">
                <span class="summary-pr-name">${x.name}</span>
                <span class="summary-pr-val">${x.pr.load}kg × ${x.pr.reps} <span style="opacity:0.6;">(e1RM ${x.pr.e1rm.toFixed(1)})</span></span>
              </div>
            `).join('')}

        ${topMuscles.length > 0 ? `

            <div class="summary-section-title">📊 Estímulo da sessão</div>

              <div class="summary-muscle-row">
                <span class="summary-muscle-name">${m.group}</span>
                <span class="summary-muscle-val">${m.sets.toFixed(1)} séries efetivas</span>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${(entry.overshootGroups && entry.overshootGroups.length > 0) ? `
          <div class="summary-section" style="background:rgba(239,159,39,0.08);border:0.5px solid rgba(239,159,39,0.3);">
            <div class="summary-section-title" style="color:var(--amber-light);">⚠️ Overshoot por sessão (Remmert 2025)</div>
            <div style="font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5;">
              Grupos acima de ${PER_SESSION_OVERSHOOT_THRESHOLD} séries efetivas/sessão — retornos decrescentes prováveis.
            </div>
            ${entry.overshootGroups.map(o => `
              <div class="summary-muscle-row">
                <span class="summary-muscle-name">${o.group}</span>

function closeSummary(target) {
  const overlay = $id('summary-overlay');
  if (overlay) {
    overlay.classList.remove('visible');
    setTimeout(() => overlay.remove(), 200);
  }
  if (target === 'hist') {
    currentTab = "📊";
    histSubTab = 'resumo';
  } else {
    currentTab = target;
  }
  openExId = null;
  renderAll();
  // Rola pra topo
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function renderHistory(main) {
  const hist = loadHistory();
  const prs = loadPRs();
  const byTreino = {A:[], B:[], C:[], D:[]};
  hist.forEach(h => { if (byTreino[h.treino]) byTreino[h.treino].push(h); });
  const last = hist.length > 0 ? hist[hist.length-1] : null;
  const totalSessions = hist.length;
  const totalVol = hist.reduce((s,h) => s + (h.totalLoad||0), 0);
  const prTotal = Object.values(prs).length;

  let html = `<div class="subtabs">
    <button class="subtab ${histSubTab==='resumo'?'active':''}" onclick="switchSubTab('resumo')">Resumo</button>
    <button class="subtab ${histSubTab==='volume'?'active':''}" onclick="switchSubTab('volume')">Volume</button>
    <button class="subtab ${histSubTab==='graficos'?'active':''}" onclick="switchSubTab('graficos')">Gráficos</button>
    <button class="subtab ${histSubTab==='exportar'?'active':''}" onclick="switchSubTab('exportar')">CSV</button>
  </div>`;

  if (histSubTab === 'resumo') {
    html += buildResumoHTML(hist, prs, byTreino, totalSessions, totalVol, prTotal, last);
    main.innerHTML = html;
  } else if (histSubTab === 'volume') {
    html += buildVolumeHTML(hist);
    main.innerHTML = html;
  } else if (histSubTab === 'graficos') {
    html += buildGraficosHTML(hist, byTreino);
    main.innerHTML = html;
    const allEx = ALL_EX_FLAT;
    const exercisesWithData = allEx.filter(ex => hist.some(h => h.exVolumes && h.exVolumes[ex.id]));
    if (typeof Chart !== 'undefined') buildCharts(hist, byTreino, exercisesWithData);
    else { console.warn('Chart.js não carregado'); }
  } else {
    html += buildExportHTML(hist, prs);
    main.innerHTML = html;
  }
}
function switchSubTab(tab) {
  histSubTab = tab;
  renderHistory($id('main-content'));
}

function buildResumoHTML(hist, prs, byTreino, totalSessions, totalVol, prTotal, last) {
  const allEx = ALL_EX_FLAT;
  let html = `<div class="summary-card">
    <div class="summary-title">Visão Geral</div>
    <div class="summary-grid">
      <div class="stat-box"><div class="stat-label">Sessões registradas</div><div class="stat-value amber">${totalSessions}</div></div>
      <div class="stat-box"><div class="stat-label">PRs ativos</div><div class="stat-value green">${prTotal}</div></div>
      <div class="stat-box"><div class="stat-label">Volume acumulado</div><div class="stat-value blue">${(totalVol/1000).toFixed(1)}t</div></div>
      <div class="stat-box"><div class="stat-label">Último treino</div><div class="stat-value teal" style="font-size:14px;">${last ? last.treino + ' · ' + last.date : '—'}</div></div>
    </div>
  </div>`;

  html += `<div class="history-section"><div class="section-title">PRs por exercício (e1RM)</div>`;
  const prEntries = Object.entries(prs).sort((a,b) => (b[1].e1rm||0) - (a[1].e1rm||0));
  if (prEntries.length === 0) {
    html += `<div style="color:var(--muted);font-size:13px;padding:10px 0;">Nenhum PR registrado.</div>`;
  } else {
    prEntries.forEach(([exId, data]) => {
      const ex = allEx.find(e => e.id === exId);
      const name = ex ? ex.name : exId;
      html += `<div class="hist-item">
        <div><div class="hist-meta">${name}</div><div class="hist-detail">Treino ${exId[0].toUpperCase()} · ${data.date}</div></div>
        <div style="text-align:right;">
          <div style="font-size:15px;font-weight:600;color:var(--amber-light);">${data.load}kg × ${data.reps}</div>
          <div style="font-size:11px;color:var(--muted);">e1RM ${(data.e1rm || epley1RM(data.load, data.reps)).toFixed(1)}kg</div>
        </div>
      </div>`;
    });
  }
  html += `</div>`;

  html += `<div class="history-section"><div class="section-title">Últimas sessões</div>`;
  const recent = [...hist].reverse().slice(0, 15);
  if (recent.length === 0) {
    html += `<div style="color:var(--muted);font-size:13px;padding:10px 0;">Nenhuma sessão finalizada ainda.</div>`;
  } else {
    recent.forEach(h => {
      const meta = [];
      if (h.bodyweight) meta.push(`${h.bodyweight}kg`);
      if (h.sleep_hours) meta.push(`${h.sleep_hours}h sono`);
      if (h.cardio_min) meta.push(`${h.cardio_min}min cardio`);
      html += `<div class="hist-item">
        <div><div class="hist-meta">Treino ${h.treino} · ${h.totalSets} séries</div>
             <div class="hist-detail">${meta.join(' · ') || 'sem metadata'}${h.prCount ? ' · '+h.prCount+' PR' : ''}</div>
             ${h.notes ? `<div style="font-size:10px;color:var(--muted);margin-top:2px;font-style:italic;opacity:0.7;">${h.notes}</div>` : ''}</div>
        <div style="text-align:right;">
          <div style="font-size:14px;font-weight:600;color:var(--blue);">${(h.totalLoad/1000).toFixed(2)}t</div>
          <div style="font-size:12px;color:var(--muted);">${h.date}</div>
        </div>
      </div>`;
    });
  }
  html += `</div>`;
  html += `<div class="danger-zone">
    <div class="danger-title">Zona de perigo</div>
    <div class="danger-desc">Apaga permanentemente todo o histórico de sessões e PRs armazenados neste navegador.</div>
    <button class="btn-trigger-delete" onclick="showDeleteConfirm()">Apagar todo o histórico</button>
    <div class="danger-confirm" id="delete-confirm">
      <div class="danger-confirm-text">Tem certeza? Todo o histórico de <strong>${hist.length} sessão(ões)</strong> e <strong>${Object.keys(prs).length} PR(s)</strong> será apagado permanentemente.</div>
      <div class="danger-btn-row">
        <button class="btn-cancel" onclick="hideDeleteConfirm()">Cancelar</button>
        <button class="btn-delete" onclick="confirmDeleteAll()">Apagar tudo</button>
      </div>
    </div>
  </div>`;
  html += `<div class="spacer"></div>`;
  return html;
}

function buildVolumeHTML(hist) {
  const wk1 = getWeeklyVolume(hist, 1);
  const wk2 = getWeeklyVolume(hist, 2);
  const landmarks = getLandmarks();
  const deloadActive = CONFIG?.deload_week === 1;

  let html = `<div class="summary-card">
    <div class="summary-title">Volume por microciclo · Séries efetivas (Pelland 2026 + Robinson 2024)</div>
    <div style="font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:12px;">
      Janela de ${MICROCYCLE_WINDOW_DAYS} dias rolling (ciclo 3 on/1 off ≈ semana RP).
      Contagem fractional EMG (coef ≥0.75 → 1.0 · 0.40–0.74 → 0.5) com peso RIR (Robinson 2024).
      Landmarks: MEV natural RP + MAV/MRV +30% para contexto enhanced (Hammarström 2020).
      ${deloadActive ? '<br><span style="color:var(--amber);font-weight:600;">⏸ Deload ativo — landmarks × 0.5</span>' : ''}
    </div>
  </div>`;

  html += `<div class="history-section">`;
  Object.keys(landmarks).forEach(grp => {
    const lm = landmarks[grp];
    const v1 = wk1[grp] || 0;
    const v2_perMicro = (wk2[grp] || 0) / 2;
    const status = volumeStatus(v1, lm);
    // Posições no bar (escala 0 → 1.3 × MRV)
    const scaleMax = lm.mrv * 1.3 || 1;
    const fillPct = Math.min(100, (v1 / scaleMax) * 100);
    const mevPct = (lm.mev / scaleMax) * 100;
    const mavPct = (lm.mav / scaleMax) * 100;
    const mrvPct = (lm.mrv / scaleMax) * 100;
    let fillColor;
    if (status.tier === "below") fillColor = "var(--muted)";
    else if (status.tier === "mev") fillColor = "var(--amber)";
    else if (status.tier === "optimal") fillColor = "var(--green)";
    else fillColor = "var(--red)";

    html += `<div class="vol-row">
      <div class="vol-row-top">
        <span class="vol-muscle">${lm.label}</span>
        <span class="vol-num ${status.color}">${v1.toFixed(1)} séries · ${status.label}</span>
      </div>
      <div class="vol-bar">
        <div class="vol-bar-fill" style="width:${fillPct}%;background:${fillColor};"></div>
        <div class="vol-bar-mev" style="left:${mevPct}%;" data-l="MEV"></div>
        <div class="vol-bar-mav" style="left:${mavPct}%;" data-l="MAV"></div>
        <div class="vol-bar-mrv" style="left:${mrvPct}%;" data-l="MRV"></div>
      </div>
      <div class="vol-row-foot">
        <span>MEV ${lm.mev} · MAV ${lm.mav} · MRV ${lm.mrv}</span>
        <span>2-micro: ${v2_perMicro.toFixed(1)}/ciclo</span>
      </div>
    </div>`;
  });
  html += `</div><div class="spacer"></div>`;
  return html;
}

// ─── CHARTS ───────────────────────────────────────────────────
const CHART_DEFAULTS = {
  color: '#EF9F27',
  gridColor: 'rgba(255,255,255,0.06)',
  textColor: '#888885'
};

function chartBase(id, type, labels, datasets, opts={}) {
  const el = $id(id);
  if (!el) return null;
  return new Chart(el, {
    type,
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: true, animation: { duration: 400 },
      plugins: {
        legend: { display: opts.legend || false, labels: { color: CHART_DEFAULTS.textColor, font: { size: 11 }, boxWidth: 10, padding: 10 } },
        tooltip: { backgroundColor: '#2e2e2e', titleColor: '#f0f0ee', bodyColor: '#888885', borderColor: 'rgba(255,255,255,0.08)', borderWidth: 0.5, padding: 10, callbacks: opts.tooltipCallbacks || {} }
      },
      scales: opts.scales || {
        x: { ticks: { color: CHART_DEFAULTS.textColor, font: { size: 10 } }, grid: { color: CHART_DEFAULTS.gridColor }, border: { color: 'rgba(255,255,255,0.08)' } },
        y: { ticks: { color: CHART_DEFAULTS.textColor, font: { size: 10 } }, grid: { color: CHART_DEFAULTS.gridColor }, border: { color: 'rgba(255,255,255,0.08)' } }
      }
    }
  });
}

let exChartInstance = null;
let bwChartInstance = null;
let histSnapshot = [];
let exercisesSnapshot = [];

function buildCharts(hist, byTreino, exercisesWithData) {
  histSnapshot = hist;
  exercisesSnapshot = exercisesWithData;

  // 1: volume por sessão (linha)
  if (hist.length >= 2) {
    const labels = hist.map(h => h.date.slice(0,5));
    const data = hist.map(h => h.totalLoad);
    chartBase('chart-vol', 'line', labels, [{
      data, borderColor: '#EF9F27', backgroundColor: 'rgba(239,159,39,0.08)',
      borderWidth: 2, pointBackgroundColor: '#EF9F27', pointRadius: 3, pointHoverRadius: 5,
      fill: true, tension: 0.3
    }], { tooltipCallbacks: { label: ctx => ` ${ctx.parsed.y.toLocaleString('pt-BR')} kg` } });
  }

  // 2: volume médio por treino (barra)
  const treinoLabels = ['A','B','C','D'];
  const treinoAvg = treinoLabels.map(k => {
    const sessions = byTreino[k];
    if (!sessions.length) return 0;
    return Math.round(sessions.reduce((s,h) => s + h.totalLoad, 0) / sessions.length);
  });
  const barColors = ['rgba(239,159,39,0.7)','rgba(55,138,221,0.7)','rgba(29,158,117,0.7)','rgba(151,196,89,0.7)'];
  chartBase('chart-treino', 'bar', treinoLabels, [{
    data: treinoAvg, backgroundColor: barColors,
    borderColor: barColors.map(c => c.replace('0.7','1')), borderWidth: 1, borderRadius: 4
  }], { tooltipCallbacks: { label: ctx => ` ${ctx.parsed.y.toLocaleString('pt-BR')} kg` } });

  // 3: exercício selecionado — agora plotando e1RM
  if (exercisesWithData.length > 0) updateExChart();

  // 4: peso corporal + moving average 7d (Melhoria 6)
  const bwData = hist.filter(h => h.bodyweight);
  if (bwData.length >= 2) {
    const labels = bwData.map(h => h.date.slice(0,5));
    const rawData = bwData.map(h => h.bodyweight);
    // Moving average 7 pontos (ou todos se < 7)
    const maData = rawData.map((_, i) => {
      const window = rawData.slice(Math.max(0, i - 6), i + 1);
      return +(window.reduce((a,b) => a+b, 0) / window.length).toFixed(2);
    });
    chartBase('chart-bw', 'line', labels, [
      {
        data: rawData, label: "Peso (kg)", borderColor: '#1D9E75',
        backgroundColor: 'rgba(29,158,117,0.06)', borderWidth: 1.5,
        pointBackgroundColor: '#1D9E75', pointRadius: 2.5, pointHoverRadius: 5,
        fill: true, tension: 0.2
      },
      {
        data: maData, label: "Média 7d", borderColor: '#FAC775',
        backgroundColor: 'transparent', borderWidth: 2,
        pointRadius: 0, pointHoverRadius: 4,
        fill: false, tension: 0.4, borderDash: [4, 3]
      }
    ], {
      legend: true,
      tooltipCallbacks: { label: ctx => ` ${ctx.parsed.y.toFixed(1)} kg` }
    });
  }
}

function updateExChart() {
  const sel = $id('ex-select');
  if (!sel) return;
  const exId = sel.value;
  const points = histSnapshot.filter(h => h.exSets && h.exSets[exId]);
  // Plota e1RM máximo do exercício na sessão (proxy de força)
  const data = points.map(h => {
    const sets = h.exSets[exId].filter(s => s.done && s.load > 0);
    if (sets.length === 0) return null;
    return Math.max(...sets.map(s => epley1RM(s.load, s.reps)));
  }).filter(v => v !== null);
  const labels = points.filter(h => {
    const sets = h.exSets[exId].filter(s => s.done && s.load > 0);
    return sets.length > 0;
  }).map(h => h.date.slice(0,5));
  const ex = ALL_EX_FLAT.find(e => e.id === exId);
  const name = ex ? ex.name : exId;

  if (exChartInstance) { exChartInstance.destroy(); exChartInstance = null; }
  if (data.length < 1) return;

  exChartInstance = chartBase('chart-ex', 'line', labels, [{
    label: name + " · e1RM", data,
    borderColor: '#97C459', backgroundColor: 'rgba(99,153,34,0.08)',
    borderWidth: 2, pointBackgroundColor: '#97C459', pointRadius: 4, pointHoverRadius: 6,
    fill: true, tension: 0.3
  }], { legend: false, tooltipCallbacks: { label: ctx => ` ${ctx.parsed.y.toFixed(1)} kg` } });
}
