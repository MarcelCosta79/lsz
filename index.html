function csvEsc(v) {
  if (v === null || v === undefined || v === '') return '';
  const s = String(v);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function isoDate(ddmmyyyy) {
  if (!ddmmyyyy) return '';
  const [d, m, y] = ddmmyyyy.split('/');
  return `${y}-${m}-${d}`;
}
function weekNumber(dateObj) {
  const d = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

const WEEKDAYS_PT = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const ALL_EX_FLAT = [
  ...TREINOS.A.exercises.map((e,i) => ({...e, group:'A', order:i+1})),
  ...TREINOS.B.exercises.map((e,i) => ({...e, group:'B', order:i+1})),
  ...TREINOS.C.exercises.map((e,i) => ({...e, group:'C', order:i+1})),
  ...TREINOS.D.exercises.map((e,i) => ({...e, group:'D', order:i+1})),
];

function buildCSVRow(session, exDef, setData) {
  const dateObj = new Date(isoDate(session.date));
  const load = setData.load || 0;
  const reps = setData.reps || 0;
  const vol  = load * reps;
  const e1rm = reps > 0 ? +(load * (1 + reps / 30)).toFixed(1) : load;
  const intPct = e1rm > 0 ? +((load / e1rm) * 100).toFixed(1) : '';
  const inol = (intPct !== '' && intPct < 100) ? +((reps / (100 - intPct)).toFixed(3)) : '';
  const ms = session.muscleSets || {};
  return {
    session_id:                 new Date(session.ts || 0).toISOString(),
    schema_version:             session.schemaVersion || 1,
    date:                       session.date,
    date_iso:                   isoDate(session.date),
    weekday:                    WEEKDAYS_PT[dateObj.getDay()] || '',
    week_number:                weekNumber(dateObj),
    month:                      dateObj.getMonth() + 1,
    year:                       dateObj.getFullYear(),
    treino_id:                  session.treino,
    treino_label:               session.treinoLabel || ('Treino ' + session.treino),
    treino_focus:               session.focus || '',
    treino_rec_target:          session.recTarget || '',
    session_total_load_kg:      session.totalLoad || 0,
    session_total_sets:         session.totalSets || 0,
    session_pr_count:           session.prCount || 0,
    bodyweight_kg:              session.bodyweight ?? '',
    sleep_hours:                session.sleep_hours ?? '',
    cardio_min_pre:             session.cardio_min ?? '',
    mesocycle:                  session.mesocycle || '',
    protocol_label:             session.protocol_label || '',
    cycle_day:                  session.cycle_day ?? '',
    deload:                     session.deload ?? 0,
    exercise_id:                exDef.id,
    exercise_name:              exDef.name,
    exercise_order:             exDef.order,
    exercise_group:             exDef.group,
    exercise_total_sets_planned: exDef.sets.length,
    exercise_vol_session_kg:    session.exVolumes?.[exDef.id] || 0,
    set_number:                 setData.setNum,
    set_done:                   setData.done,
    load_kg:                    load,
    reps_done:                  reps,
    reps_target:                setData.targetReps || '',
    rir:                        (setData.rir === null || setData.rir === undefined) ? '' : setData.rir,
    volume_kg:                  Math.round(vol),
    estimated_1rm:              e1rm,
    intensity_pct:              intPct,
    inol:                       inol,
    emg_peito_sets:             ms.peito ?? '',
    emg_costas_sets:            ms.costas ?? '',
    emg_trapezio_meio_sets:     ms.trapezio_meio ?? '',
    emg_deltoide_anterior_sets: ms.deltoide_anterior ?? '',
    emg_deltoide_medial_sets:   ms.deltoide_medial ?? '',
    emg_deltoide_posterior_sets:ms.deltoide_posterior ?? '',
    emg_biceps_sets:            ms.biceps ?? '',
    emg_triceps_sets:           ms.triceps ?? '',
    emg_antebraco_sets:         ms.antebraco ?? '',
    emg_quadriceps_sets:        ms.quadriceps ?? '',
    emg_isquios_sets:           ms.isquios ?? '',
    emg_gluteo_sets:            ms.gluteo ?? '',
    emg_panturrilha_sets:       ms.panturrilha ?? '',
    emg_abdomen_sets:           ms.abdomen ?? '',
    emg_eretores_sets:          ms.eretores ?? '',
    emg_adutor_abdutor_sets:    ms.adutor_abdutor ?? '',
    rest_sec: '', tempo_eccentric: '', tempo_concentric: '',
    notes: session.notes || '', bf_pct_pollock: '',
    overshoot_groups: (session.overshootGroups && session.overshootGroups.length > 0)
      ? session.overshootGroups.map(o => `${o.group}:${o.sets}`).join('|')
      : '',
  };
}

function generateCSV_sessions(hist) {
  const cols = CSV_COLUMNS.map(c => c.key);
  const lines = ['\uFEFF' + cols.join(',')];
  for (const session of hist) {
    for (const exDef of ALL_EX_FLAT) {
      const sets = session.exSets?.[exDef.id];
      if (!sets) continue;
      for (const s of sets) lines.push(cols.map(k => csvEsc(buildCSVRow(session, exDef, s)[k])).join(','));
    }
  }
  return lines.join('\r\n');
}

function generateCSV_prs(prs) {
  const cols = ['exercise_id','exercise_name','exercise_group','load_kg','reps','volume_kg','estimated_1rm','date','date_iso'];
  const lines = ['\uFEFF' + cols.join(',')];
  for (const [exId, data] of Object.entries(prs)) {
    const exDef = ALL_EX_FLAT.find(e => e.id === exId);
    const name = exDef ? exDef.name : exId;
    const group = exDef ? exDef.group : '';
    const vol = (data.load || 0) * (data.reps || 0);
    const e1rm = data.e1rm || epley1RM(data.load, data.reps);
    lines.push([exId, name, group, data.load, data.reps, Math.round(vol), e1rm.toFixed(1), data.date, isoDate(data.date)].map(csvEsc).join(','));
  }
  return lines.join('\r\n');
}

function generateCSV_volume(hist) {
  // Por semana × grupo muscular (séries efetivas)
  const cols = ['week_iso', 'muscle_group', 'effective_sets', 'mev', 'mav', 'mrv', 'status'];
  const lines = ['\uFEFF' + cols.join(',')];
  // Agrupa por semana (YYYY-WW)
  const byWeek = {};
  hist.forEach(h => {
    if (!h.ts) return;
    const d = new Date(h.ts);
    const w = `${d.getFullYear()}-W${String(weekNumber(d)).padStart(2,'0')}`;
    if (!byWeek[w]) byWeek[w] = {};
    if (!h.muscleSets) return;
    Object.keys(h.muscleSets).forEach(grp => {
      byWeek[w][grp] = (byWeek[w][grp] || 0) + h.muscleSets[grp];
    });
  });
  Object.keys(byWeek).sort().forEach(w => {
    Object.keys(VOLUME_LANDMARKS_BASE).forEach(grp => {
      const sets = byWeek[w][grp] || 0;
      const lm = VOLUME_LANDMARKS_BASE[grp];
      const status = volumeStatus(sets, lm);
      lines.push([w, grp, sets.toFixed(2), lm.mev, lm.mav, lm.mrv, status.label].map(csvEsc).join(','));
    });
  });
  return lines.join('\r\n');
}

function downloadBlob(content, filename) {
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}
function exportCSV(type) {
  const hist = loadHistory();
  const prs = loadPRs();
  const today_str = new Date().toISOString().slice(0,10);
  // Melhoria 7: nome inclui treino ativo e semana ISO
  const weekStr = (() => {
    const d = new Date();
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    const yr = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return `W${String(Math.ceil((((d - yr) / 86400000) + 1) / 7)).padStart(2,'0')}`;
  })();
  const treino_tag = (currentTab !== "📊" && currentTab !== "⚙️") ? `_T${currentTab}` : '';
  if (type === 'sessions') downloadBlob(generateCSV_sessions(hist), `marcel_sessions${treino_tag}_${today_str}_${weekStr}.csv`);
  else if (type === 'prs') downloadBlob(generateCSV_prs(prs), `marcel_prs_${today_str}.csv`);
  else if (type === 'volume') downloadBlob(generateCSV_volume(hist), `marcel_volume_${today_str}_${weekStr}.csv`);
  showToast("✅ CSV gerado", "success");
}

function buildExportHTML(hist, prs) {
  const totalRows = hist.reduce((acc, h) => {
    return acc + ALL_EX_FLAT.filter(ex => h.exSets && h.exSets[ex.id]).reduce((a, ex) => a + (h.exSets[ex.id]?.length || 0), 0);
  }, 0);
  const hasPRData = Object.keys(prs).length > 0;
  const isEmpty = hist.length === 0;
  const COLS = CSV_COLUMNS.map(c => c.key);
  const previewRows = [];
  outer: for (const h of hist) {
    for (const ex of ALL_EX_FLAT) {
      if (h.exSets && h.exSets[ex.id]) {
        for (const s of h.exSets[ex.id]) {
          previewRows.push(buildCSVRow(h, ex, s));
          if (previewRows.length >= 2) break outer;
        }
      }
    }
  }
  const previewLine = previewRows.length > 0
    ? COLS.slice(0,15).join(',') + ',...\n' + previewRows.map(r => COLS.slice(0,15).map(k => csvEsc(r[k])).join(',') + ',...').join('\n')
    : COLS.slice(0,15).join(',') + ',...\n(sem dados ainda)';

  let html = `<div class="export-card">
    <div class="export-title">Exportar dados completos</div>
    <div class="export-desc">CSV com granularidade de série · uma linha por série executada · ${CSV_COLUMNS.length} colunas incluindo agregados EMG-weighted por grupo muscular.</div>
    <div class="export-meta">
      <span class="export-pill">${hist.length} sessões</span>
      <span class="export-pill">${totalRows} séries</span>
      <span class="export-pill">${CSV_COLUMNS.length} colunas</span>
      <span class="export-pill">UTF-8 BOM</span>
      <span class="export-pill">v3</span>
    </div>
    <button class="export-btn export-btn-primary" onclick="exportCSV('sessions')" ${isEmpty?'disabled':''}>
      Baixar sessions.csv (granular)
    </button>
    <button class="export-btn export-btn-secondary" onclick="exportCSV('prs')" ${!hasPRData?'disabled':''}>
      Baixar prs.csv
    </button>
    <button class="export-btn export-btn-secondary" onclick="exportCSV('volume')" ${isEmpty?'disabled':''}>
      Baixar volume.csv (semanal × grupo)
    </button>
    <div class="export-preview">${previewLine}</div>
  </div>`;

  html += `<div class="export-card">
    <div class="export-title">Dicionário · sessions.csv (${CSV_COLUMNS.length} colunas)</div>
    <div class="export-desc">Schema v3 com EMG aggregates. Colunas reservadas vazias agora — cabeçalho preservado para compatibilidade com fórmulas downstream.</div>
    <table class="col-table">
      <thead><tr><th>Coluna</th><th>Tipo</th><th>Descrição</th></tr></thead>
      <tbody>
        ${CSV_COLUMNS.map(c => `<tr>
          <td>${c.key}</td>
          <td style="color:var(--teal);white-space:nowrap;">${c.type}</td>
          <td>${c.desc}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
  html += `<div class="spacer"></div>`;
  return html;
}

      </div>
      <select class="config-input" onchange="updateConfig('deload_week', parseInt(this.value))">
        <option value="0" ${CONFIG.deload_week===0?'selected':''}>Não</option>
        <option value="1" ${CONFIG.deload_week===1?'selected':''}>Sim</option>
      </select>
    </div>
    <div class="config-row">
      <div>
        <div class="config-label">Beep de descanso</div>
        <div class="config-label-sub">Som ao zerar o timer</div>
      </div>
      <select class="config-input" onchange="updateConfig('beep_enabled', this.value==='true')">
        <option value="true" ${CONFIG.beep_enabled?'selected':''}>Ligado</option>
        <option value="false" ${!CONFIG.beep_enabled?'selected':''}>Desligado</option>
      </select>
    </div>
    <div class="config-row">
      <div>
        <div class="config-label">Vibração háptica</div>
        <div class="config-label-sub">Mobile only · feedback tátil</div>
      </div>
      <select class="config-input" onchange="updateConfig('haptic_enabled', this.value==='true')">
        <option value="true" ${CONFIG.haptic_enabled?'selected':''}>Ligado</option>
        <option value="false" ${!CONFIG.haptic_enabled?'selected':''}>Desligado</option>
      </select>
    </div>
  </div>`;

  // Diagnóstico
  const hist = loadHistory();
  const prs = loadPRs();
  html += `<div class="config-card">
    <div class="summary-title">Diagnóstico de armazenamento</div>
    <div class="config-row"><div><div class="config-label">Sessões salvas</div></div><div style="text-align:right;font-weight:600;">${hist.length}</div></div>
    <div class="config-row"><div><div class="config-label">PRs registrados</div></div><div style="text-align:right;font-weight:600;">${Object.keys(prs).length}</div></div>
    <div class="config-row"><div><div class="config-label">Limite de sessões</div></div><div style="text-align:right;font-weight:600;">${HIST_LIMIT}</div></div>
    <div class="config-row"><div><div class="config-label">Schema</div></div><div style="text-align:right;font-weight:600;">v3</div></div>
  </div>`;
  html += `<div class="spacer"></div>`;
  main.innerHTML = html;
}
function updateConfig(key, value) {
  CONFIG[key] = value;
  saveConfig(CONFIG);
  showToast("✅ Config salva", "success");
}

// ─── DELETE ───────────────────────────────────────────────────
function showDeleteConfirm() { $id('delete-confirm')?.classList.add('visible'); }
function hideDeleteConfirm() { $id('delete-confirm')?.classList.remove('visible'); }
function confirmDeleteAll() {
  localStorage.removeItem(HIST_KEY);
  localStorage.removeItem(PR_KEY);
  histSubTab = 'resumo';
  renderAll();
  showToast("Histórico apagado", "warn");
}

// ─── INIT ─────────────────────────────────────────────────────
purgeStaleDrafts(); // Remove drafts com mais de 48h
$id("today-date").textContent = today();
renderAll();

// Mantém UI sincronizada se usuário voltar de outra aba
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    // Atualiza display de timers que estavam rodando
    Object.keys(timers).forEach(exId => {
      const tk = timers[exId];
      if (!tk) return;
      const display = $id("timer_" + exId);
      if (display) {
        tk.elapsed = Math.floor((Date.now() - tk.startMs) / 1000);
        display.textContent = fmtMMSS(tk.target - tk.elapsed);
      }
    });
  }
});

</script>
</body>
</html>
